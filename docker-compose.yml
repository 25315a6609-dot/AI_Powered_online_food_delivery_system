services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodfusion
      POSTGRES_USER: foodfusion
      POSTGRES_PASSWORD: change-this-in-deployment-secrets
    volumes:
      - foodfusion-db:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://foodfusion:change-this-in-deployment-secrets@db:5432/foodfusion
      FOODFUSION_AUTH_SECRET: ${FOODFUSION_AUTH_SECRET:?set a secure secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  foodfusion-db:
