services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodfusion
      POSTGRES_USER: foodfusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong URL-safe database password}
    volumes:
      - foodfusion-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodfusion -d foodfusion"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the Postgres URL using host db}
      FOODFUSION_AUTH_SECRET: ${FOODFUSION_AUTH_SECRET:?set a secure secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FOODFUSION_CORS_ORIGINS: ${FOODFUSION_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  foodfusion-db:
